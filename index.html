<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-Chronicle: Time Paradox</title>
    <style>
        :root { --main: #7000ff; --accent: #00ffaa; --bg: #050505; }
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
            overflow: hidden;
        }
        #game-box { 
            width: 90%; max-width: 500px; padding: 30px; border: 1px solid var(--main);
            border-radius: 20px; text-align: center; background: rgba(112, 0, 255, 0.05);
            box-shadow: 0 0 30px rgba(112, 0, 255, 0.2);
        }
        .data-text { font-size: 28px; font-weight: bold; color: var(--accent); margin: 20px 0; min-height: 40px; }
        .instruction { font-size: 16px; opacity: 0.7; margin-bottom: 10px; }
        input { 
            width: 80%; padding: 10px; background: transparent; border: none; 
            border-bottom: 2px solid var(--main); color: #fff; font-size: 20px; 
            text-align: center; outline: none; display: none; margin: 20px auto;
        }
        button { 
            padding: 12px 25px; background: var(--main); color: #fff; border: none; 
            cursor: pointer; font-weight: bold; border-radius: 5px; transition: 0.3s;
        }
        button:hover { background: var(--accent); color: #000; }
        #timer { width: 100%; height: 4px; background: #222; margin-top: 10px; }
        #timer-progress { width: 100%; height: 100%; background: var(--main); }
    </style>
</head>
<body>

<div id="game-box">
    <h2 style="color: var(--main);">R-CHRONICLE</h2>
    <div id="instruction" class="instruction">Memorize the data carefully...</div>
    <div id="display" class="data-text">READY?</div>
    <div id="timer"><div id="timer-progress"></div></div>
    
    <input type="text" id="answer-input" placeholder="Type answer here...">
    <br>
    <button id="action-btn" onclick="nextStep()">START MISSION</button>
</div>

<script>
    let history = [];
    let currentLevel = 0;
    let gameState = "START"; // START, MEMORIZE, DISTRACT, QUESTION
    let currentDistraction = null;

    const dataPool = [
        {type: "Color", items: ["RED", "BLUE", "CYAN", "GOLD", "NEON", "PURPLE"]},
        {type: "Name", items: ["ALEX", "ZARA", "MAX", "LUNA", "REX", "YUMI"]},
        {type: "Object", items: ["KEY", "BOX", "SWORD", "RING", "MAP", "COIN"]},
        {type: "City", items: ["TOKYO", "BERLIN", "SEOUL", "PARIS", "DUBAI"]}
    ];

    function nextStep() {
        const display = document.getElementById('display');
        const input = document.getElementById('answer-input');
        const btn = document.getElementById('action-btn');
        const instr = document.getElementById('instruction');

        if (gameState === "START") {
            startLevel();
        } else if (gameState === "DISTRACT") {
            checkDistraction();
        } else if (gameState === "QUESTION") {
            checkFinalAnswer();
        }
    }

    function startLevel() {
        currentLevel++;
        gameState = "MEMORIZE";
        const input = document.getElementById('answer-input');
        const btn = document.getElementById('action-btn');
        const instr = document.getElementById('instruction');
        
        // Yangi ma'lumot tanlash
        let category = dataPool[Math.floor(Math.random() * dataPool.length)];
        let item = category.items[Math.floor(Math.random() * category.items.length)];
        history.push({level: currentLevel, type: category.type, val: item});

        instr.innerText = `LEVEL ${currentLevel}: MEMORIZE THIS`;
        display.innerText = item;
        btn.style.display = "none";

        // 2 sekunddan keyin chalg'itish bosqichiga o'tadi
        setTimeout(() => {
            showDistraction();
        }, 2000);
    }

    function showDistraction() {
        gameState = "DISTRACT";
        const instr = document.getElementById('instruction');
        const input = document.getElementById('answer-input');
        const btn = document.getElementById('action-btn');

        let n1 = Math.floor(Math.random() * 20);
        let n2 = Math.floor(Math.random() * 20);
        currentDistraction = n1 + n2;

        instr.innerText = "QUICK MATH! (To clear short-term memory)";
        display.innerText = `${n1} + ${n2} = ?`;
        input.style.display = "block";
        input.value = "";
        btn.style.display = "inline-block";
        btn.innerText = "SUBMIT";
    }

    function checkDistraction() {
        const input = document.getElementById('answer-input');
        if (parseInt(input.value) === currentDistraction) {
            if (currentLevel >= 3 && Math.random() > 0.5) {
                askParadox();
            } else {
                startLevel();
            }
        } else {
            gameOver("Math error! Concentration lost.");
        }
    }

    function askParadox() {
        gameState = "QUESTION";
        const instr = document.getElementById('instruction');
        const input = document.getElementById('answer-input');
        
        // O'tmishdagi tasodifiy darajani so'rash
        let targetIdx = Math.floor(Math.random() * (history.length - 1));
        let target = history[targetIdx];
        
        instr.innerText = "TIME PARADOX!";
        display.innerText = `What was the ${target.type} at Level ${target.level}?`;
        input.value = "";
        input.style.display = "block";
        
        currentDistraction = target.val; // To'g'ri javobni saqlaymiz
    }

    function checkFinalAnswer() {
        const input = document.getElementById('answer-input');
        if (input.value.toUpperCase() === currentDistraction) {
            alert("Incredible! Your long-term memory is sharp.");
            startLevel();
        } else {
            gameOver(`Paradox! The answer was ${currentDistraction}`);
        }
    }

    function gameOver(msg) {
        alert(msg);
        location.reload();
    }
</script>

</body>
</html>
